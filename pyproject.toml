[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-pipeline"
version = "0.1.0"
description = "Nightly NBA box score pipeline: S3 raw, Postgres, dbt, Airflow, Metabase"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.11",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ingestion"]
